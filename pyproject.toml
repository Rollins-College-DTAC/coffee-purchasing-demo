[project]
name = "coffee-purchasing-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.13.0",
    "apscheduler==3.11.3",
    "faker==40.43.0",
    "pandas==3.0.6",
    "pydantic==2.14.1",
    "snowflake-connector-python==4.8.0",
    "statsmodels==0.15.0",
    "streamlit==1.65.0",
    "tinydb==4.9.0",
    "typesafe-sdk==0.7.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
