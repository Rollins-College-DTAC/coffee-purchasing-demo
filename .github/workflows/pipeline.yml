# Runs the agent once a minute inside one job and publishes state to the `data` branch,
# which the Streamlit app reads. No schedule, to save credits: it runs only when someone
# presses "Start demo" in the app (or Run workflow in the Actions tab), for 30 minutes.
name: pipeline

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to run (one import per minute)"
        required: true
        default: "30"
      backfill:
        description: "Past imports to write first; 'auto' tops history up to 40 only when it is short"
        required: true
        default: "auto"

permissions:
  contents: write   # push the data branch with GITHUB_TOKEN (does not start other workflows)
  issues: write     # read and close review requests from the Streamlit app

concurrency:
  group: pipeline
  cancel-in-progress: false   # never let two runs write the data branch at once

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 30-minute demo + setup + a backfill
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MINUTES: ${{ inputs.minutes || '30' }}
      BACKFILL: ${{ inputs.backfill || 'auto' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for commits
        run: |
          git config --global user.name "pipeline-bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check out the data branch into state/
        run: |
          if git fetch origin data:data 2>/dev/null; then
            git worktree add state data
          else
            git worktree add --orphan -b data state
          fi

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run the agent
        run: uv run python -m agent.cloud_loop --minutes "$MINUTES" --backfill "$BACKFILL" --state state/
